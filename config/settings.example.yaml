# Gptsovit Auto 配置示例。
# 复制为 config/settings.yaml，或运行：
#   run.bat init --install "你的 GPT-SoVITS 安装目录"
#
# 相对路径以工作区目录为基准；也可以写绝对路径。
install_root: ..\GPT-SoVITS
# 额外的模型包目录；每个子目录可以放 .ckpt/.pth 和参考音频。
extra_model_roots:
- ..\GPT-SoVITS models

api:
  host: 127.0.0.1
  port: 9880
  startup_timeout: 240
  switch_timeout: 240
  request_timeout: 300

output:
  root: ..\voice_output
  layout: '{voice_dir}/{project}'
  filename: '{id}_{text}'
  max_text_chars: 80
  max_path_chars: 230

defaults:
  text_lang: zh
  text_split_method: cut5
  speed_factor: 1.05
  fragment_interval: 0.15
  top_k: 15
  top_p: 1.0
  temperature: 1.0
  repetition_penalty: 1.35
  seed: -1
  batch_size: 1
  parallel_infer: true
  sample_steps: 32
  super_sampling: false
  aux_ref: true
  resume: true
  overwrite: false
  min_free_vram_mb: 4000
  order: voice
  max_text_length: 600
